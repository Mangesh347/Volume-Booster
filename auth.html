<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Volume Booster</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-card {
      max-width: 420px; margin: 64px auto; padding: 28px;
      background: var(--surface, #151515); border: 1px solid var(--line, #2c2c2c);
      border-radius: 20px;
    }
    .auth-card h1 { font-size: 22px; margin-bottom: 8px; }
    .auth-card p { color: #9a9a9a; font-size: 14px; margin-bottom: 20px; }
    .auth-status { margin-top: 16px; font-size: 13px; color: #9a9a9a; min-height: 1.4em; }
    .auth-status.ok { color: #b8f0c8; }
    .auth-status.err { color: #ffb4b4; }
    #gBtnWrap { display: flex; justify-content: center; min-height: 44px; }
    .auth-email { margin-top: 12px; font-weight: 650; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">V</span>
        <span class="brand-text">Volume Booster</span>
      </a>
      <a class="btn btn-white" href="checkout.html?cycle=yearly">Upgrade to Pro</a>
    </div>
  </header>

  <main class="wrap">
    <div class="auth-card">
      <h1>Sign in with Google</h1>
      <p>Use the same Google account you’ll pay with. Pro / Free is checked from Supabase after payment.</p>
      <div id="gBtnWrap"></div>
      <p class="auth-status" id="status">Loading sign-in…</p>
      <p class="auth-email" id="signedEmail" hidden></p>
      <p style="margin-top:16px;font-size:12px;color:#666">
        After signing in, open the extension — it syncs automatically on this site.
        Then complete checkout if you need Pro.
      </p>
    </div>
  </main>

  <script>
    (async function () {
      const status = document.getElementById("status");
      const signedEmail = document.getElementById("signedEmail");
      let cfg = {};
      try {
        cfg = await (await fetch("/api/config")).json();
      } catch {
        status.textContent = "Could not load config.";
        status.className = "auth-status err";
        return;
      }

      if (!cfg.supabase_url || !cfg.supabase_anon_key || !cfg.google_client_id) {
        status.textContent = "Add SUPABASE_URL, SUPABASE_ANON_KEY, and GOOGLE_CLIENT_ID on Vercel.";
        status.className = "auth-status err";
        return;
      }

      const supabase = window.supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);

      async function persistSession(session, email) {
        const payload = {
          access_token: session.access_token,
          refresh_token: session.refresh_token,
          expires_at: session.expires_at,
          email: email || session.user?.email || "",
          user_id: session.user?.id || "",
          saved_at: Date.now()
        };
        try {
          localStorage.setItem("vb_supabase_session", JSON.stringify(payload));
        } catch (_) {}
        signedEmail.hidden = false;
        signedEmail.textContent = "Signed in as " + payload.email;
        status.textContent = "Synced. Open Volume Booster extension to unlock Pro/Free status.";
        status.className = "auth-status ok";
      }

      const existing = await supabase.auth.getSession();
      if (existing.data?.session) {
        await persistSession(existing.data.session, existing.data.session.user?.email);
      } else {
        status.textContent = "Choose your Google account.";
      }

      function renderGoogle() {
        if (!window.google?.accounts?.id) {
          setTimeout(renderGoogle, 200);
          return;
        }
        window.google.accounts.id.initialize({
          client_id: cfg.google_client_id,
          callback: async (response) => {
            status.textContent = "Signing in…";
            status.className = "auth-status";
            try {
              const { data, error } = await supabase.auth.signInWithIdToken({
                provider: "google",
                token: response.credential
              });
              if (error) throw error;
              await persistSession(data.session, data.user?.email);
            } catch (err) {
              status.textContent = err.message || String(err);
              status.className = "auth-status err";
            }
          }
        });
        document.getElementById("gBtnWrap").innerHTML = "";
        window.google.accounts.id.renderButton(document.getElementById("gBtnWrap"), {
          theme: "filled_black",
          size: "large",
          shape: "pill",
          text: "signin_with",
          width: 320
        });
      }
      renderGoogle();
    })();
  </script>
</body>
</html>
