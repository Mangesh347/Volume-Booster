<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundBlast</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>

<header class="header">
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
        <path d="M4 9v6h3.2L12 19V5L7.2 9H4z" fill="currentColor"/>
        <path d="M15.2 8.2a4.2 4.2 0 010 7.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M17.4 6a7 7 0 010 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".4"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">SoundBlast</div>
      <div class="brand-sub">Volume Booster</div>
    </div>
  </div>
  <div class="power-wrap">
    <span class="power-label" id="statusText">On</span>
    <label class="switch">
      <input type="checkbox" id="powerToggle" checked aria-label="Turn volume boost on or off">
      <span class="switch-track"><span class="switch-thumb"></span></span>
    </label>
  </div>
</header>

<main>
  <section class="hero" aria-labelledby="volLabel">
    <div class="dial" id="dial">
      <svg class="dial-svg" viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
          </filter>
        </defs>
        <!-- Single scalloped disc (reference shape, B/W) -->
        <path id="scallopFill" class="scallop-fill" filter="url(#softShadow)"/>
        <!-- Full wavy track -->
        <path id="scallopTrack" class="scallop-track" fill="none"/>
        <!-- Volume progress along wavy edge + looping dash animation -->
        <path id="scallopProgress" class="scallop-progress" fill="none"/>
        <!-- Traveling wave highlight -->
        <path id="scallopPulse" class="scallop-pulse" fill="none"/>
      </svg>
      <div class="dial-core">
        <p class="dial-kicker" id="volLabel">Boost</p>
        <p class="dial-value" id="volValue">100%</p>
        <p class="dial-db" id="volDb">+0.0 dB</p>
      </div>
    </div>

    <label class="boost-slider">
      <input type="range" id="volumeSlider" min="0" max="600" value="100" step="1" aria-labelledby="volLabel">
      <div class="slider-ends"><span>Quiet</span><span>Max</span></div>
    </label>

    <div class="presets" role="group" aria-label="Boost presets">
      <button type="button" class="preset active" data-vol="100">1×</button>
      <button type="button" class="preset" data-vol="150">1.5×</button>
      <button type="button" class="preset" data-vol="200">2×</button>
      <button type="button" class="preset" data-vol="300">3×</button>
      <button type="button" class="preset" data-vol="400">4×</button>
      <button type="button" class="preset" data-vol="600">Max</button>
    </div>

    <div class="safe-pill" id="safePill">
      <span id="safeText">Safe Boost — clear &amp; smooth</span>
    </div>
  </section>

  <section class="quality" aria-labelledby="qualityTitle">
    <div class="quality-head">
      <h2 id="qualityTitle">Sound</h2>
      <p>Simple controls — clear boost, no harshness</p>
    </div>

    <div class="scenes" role="group" aria-label="Sound scenes">
      <button type="button" class="scene active" data-mode="softclear">Clear</button>
      <button type="button" class="scene" data-mode="bass">Bass</button>
      <button type="button" class="scene" data-mode="vocal">Voice</button>
      <button type="button" class="scene" data-mode="cinema">Movie</button>
      <button type="button" class="scene" data-mode="lofi">Soft</button>
    </div>

    <label class="row">
      <span class="row-top"><span>Clarity</span><span id="clarityVal">40%</span></span>
      <input type="range" id="claritySlider" min="0" max="100" value="40">
    </label>
    <label class="row">
      <span class="row-top"><span>Bass</span><span id="bassBoostVal">25%</span></span>
      <input type="range" id="bassBoostSlider" min="0" max="100" value="25">
    </label>
    <label class="row">
      <span class="row-top"><span>Space</span><span id="spaceVal">0%</span></span>
      <input type="range" id="spaceSlider" min="0" max="100" value="0">
    </label>
    <label class="row">
      <span class="row-top"><span>Surround</span><span id="widenVal">0%</span></span>
      <input type="range" id="widenSlider" min="0" max="100" value="0">
    </label>
  </section>
</main>

<footer class="footer">
  <span class="site" id="siteBadge">—</span>
  <div class="footer-actions">
    <button type="button" class="icon-btn" id="settingsBtn" aria-expanded="false" aria-controls="settingsPanel" title="More">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <a class="link-btn" id="proCheckoutLink" href="https://volume-booster-ten.vercel.app/checkout.html?cycle=yearly" target="_blank" rel="noopener">Pro</a>
  </div>
</footer>

<div class="settings" id="settingsPanel" hidden>
  <label class="settings-row">
    <span>Remember on this site</span>
    <button type="button" class="text-btn" id="autoApplyBtn">Auto off</button>
  </label>
  <div class="settings-row">
    <button type="button" class="text-btn" id="saveBtn">Save</button>
    <button type="button" class="text-btn" id="resetBtn">Reset</button>
  </div>
  <div class="settings-row pro-row">
    <input type="email" id="proEmail" placeholder="Billing email or license" autocomplete="email">
    <button type="button" class="text-btn" id="proUnlockBtn">Unlock Pro</button>
  </div>
  <p class="settings-hint" id="proHint">After payment: paste the same billing email, then Unlock Pro.</p>
</div>

<script src="plan.js"></script>
<script src="popup.js"></script>
</body>
</html>
